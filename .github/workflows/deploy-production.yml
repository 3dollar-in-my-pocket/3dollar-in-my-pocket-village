name: Deploy production

# GitHub 릴리즈가 발행되면 production(boong-village)에 배포
# 필요한 시크릿: CLOUDFLARE_API_TOKEN (Workers 스크립트 편집 + D1 편집 권한)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 태그 또는 브랜치 (예 v1.0.0)
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f61f6fa005fd15eb616e41a677add017
      REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 production 배포를 건너뜁니다. 저장소 Settings > Secrets and variables > Actions에 추가해 주세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      # 새 코드가 새 컬럼을 쓰므로 마이그레이션을 배포보다 먼저 적용
      - name: Apply D1 migrations
        if: steps.guard.outputs.ready == 'true'
        run: |
          for i in 1 2 3; do
            npx wrangler d1 migrations apply boong-village --remote --env production && exit 0
            echo "마이그레이션 실패, 재시도 ($i/3)"; sleep 5
          done
          exit 1

      - name: Deploy worker
        if: steps.guard.outputs.ready == 'true'
        run: npx wrangler deploy --env production --message "Release $REF"
