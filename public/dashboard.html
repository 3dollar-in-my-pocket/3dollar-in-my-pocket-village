<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>붕어빌리지 랭킹</title>
  <link rel="icon" href="assets/appicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <style>
    html, body { overflow: auto; background: linear-gradient(180deg, #FFE3CC, #FFEBD9 50%, #FFF6EC); min-height: 100%; }
    .dash { max-width: 860px; margin: 0 auto; padding: calc(24px + var(--safe-top)) 16px 40px; }
    .dash-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .dash-head img { width: 64px; }
    .dash-head h1 { margin: 0; font-size: 26px; }
    .dash-head p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
    .dash-head a { margin-left: auto; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .kpi { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(122, 74, 42, 0.08); }
    .kpi span { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
    .kpi strong { display: block; margin-top: 4px; font-size: 22px; font-variant-numeric: tabular-nums; }
    .board { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 8px 30px rgba(122, 74, 42, 0.1); }
    .rank-row { font-variant-numeric: tabular-nums; transition: background 0.4s ease; }
    .rank-row.flash { background: #E6FFF1; }
    .rank-row img { width: 44px; height: 44px; }
    .rank-row .bar { grid-column: 3 / 5; height: 4px; border-radius: 99px; background: #F1E6DB; overflow: hidden; margin-top: -2px; }
    .rank-row .bar i { display: block; height: 100%; background: var(--pink); border-radius: 99px; transition: width 0.6s ease; }
    .board-empty { margin: 24px 0; text-align: center; font-size: 14px; color: var(--ink-soft); }
    .updated { margin-top: 12px; text-align: center; font-size: 12px; color: var(--ink-soft); }
    @media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } .dash-head a { display: none; } }
  </style>
</head>
<body>
  <main class="dash">
    <header class="dash-head">
      <img src="assets/splash.png" alt=""><img src="assets/cat/bungeoppang-tight.svg" alt="" style="width:56px">
      <div>
        <h1>붕어빌리지 사장님 랭킹</h1>
        <p><span class="dot"></span>&nbsp; 자본이 많은 순서 · 실시간 업데이트</p>
      </div>
      <a class="btn primary small" href="/">마을로 가기</a>
    </header>
    <section class="kpis">
      <div class="kpi"><span>지금 마을에</span><strong id="k-online">0명</strong></div>
      <div class="kpi"><span>영업 중인 가게</span><strong id="k-open">0곳</strong></div>
      <div class="kpi"><span>팔린 붕어빵</span><strong id="k-sold">0마리</strong></div>
      <div class="kpi"><span>마을 총 자본</span><strong id="k-total">0원</strong></div>
    </section>
    <section class="board">
      <div class="podium" id="podium"></div>
      <div class="rank-list" id="list"></div>
    </section>
    <p class="updated" id="updated"></p>
  </main>
  <script type="module">
    import { net } from './js/net.js';
    import { won } from './js/data.js';

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const FALLBACK_FACE = 'assets/cat/bungeoppang-tight.svg';
    const prevCapital = new Map();
    let portraitOf = null;
    let received = false;
    let timer = null;

    const face = (character) => {
      if (!portraitOf) return FALLBACK_FACE;
      try {
        return portraitOf(character, { size: 140 });
      } catch {
        return FALLBACK_FACE;
      }
    };

    function setStatus(text) {
      $('#updated').textContent = text;
    }

    function render() {
      const st = net.stats;
      $('#k-online').textContent = `${st.active}/${st.capacity}명${st.queued ? ` (대기 ${st.queued})` : ''}`;
      $('#k-open').textContent = `${st.openStalls}곳`;
      $('#k-sold').textContent = `${(st.totalSold || 0).toLocaleString('ko-KR')}마리`;
      $('#k-total').textContent = won(st.totalCapital);

      const ranking = net.ranking();
      if (!ranking.length) {
        $('#podium').innerHTML = '';
        $('#list').innerHTML = `<p class="board-empty">${received ? '아직 랭킹에 오른 사장님이 없어요' : '랭킹을 불러오는 중…'}</p>`;
        return;
      }
      const top = ranking.slice(0, 3);
      $('#podium').innerHTML = [top[1], top[0], top[2]].map((p, i) => {
        if (!p) return '<div></div>';
        const rank = [2, 1, 3][i];
        return `<div class="podium-item r${rank}">
          <img src="${face(p.character)}" alt="">
          <span class="name">${esc(p.nickname)}</span>
          <span class="money">${won(p.capital)}</span>
          <div class="block">${rank}</div></div>`;
      }).join('');
      const max = Math.max(1, ...ranking.map((p) => p.capital));
      $('#list').innerHTML = ranking.slice(0, 100).map((p, i) => {
        const changed = prevCapital.has(p.id) && prevCapital.get(p.id) !== p.capital;
        return `<div class="rank-row${changed ? ' flash' : ''}">
          <span class="no">${i + 1}</span>
          <img src="${face(p.character)}" alt="">
          <div class="who"><strong>${p.online ? '<i class="online-dot"></i>' : ''}${esc(p.nickname)}${p.bot ? ' · NPC' : ''}</strong>
            <span>${p.sold}마리 판매${p.stall?.open ? ' · 영업중' : ''}</span></div>
          <div class="cap">${won(p.capital)}<small>자본</small></div>
          <div class="bar"><i style="width:${(p.capital / max) * 100}%"></i></div>
        </div>`;
      }).join('');
      ranking.forEach((p) => prevCapital.set(p.id, p.capital));
      setStatus(`마지막 업데이트 ${new Date().toLocaleTimeString('ko-KR')}`);
    }

    const schedule = () => { clearTimeout(timer); timer = setTimeout(render, 120); };
    net.on('ranking', () => { received = true; schedule(); });
    net.on('stats', schedule);
    net.on('connection', (ok) => { if (!ok) setStatus('서버와 연결이 끊겼어요. 다시 연결하는 중…'); });

    import('./js/people.js')
      .then((m) => { portraitOf = m.presetPortrait; schedule(); })
      .catch(() => {});

    setStatus('서버에 연결하는 중…');
    render();
    net.connect({ viewer: true });
  </script>
  <script>
    if (location.hostname === 'boong-village.3dollarinmypocket.workers.dev') {
      const cfBeacon = document.createElement('script');
      cfBeacon.defer = true;
      cfBeacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      cfBeacon.setAttribute('data-cf-beacon', '{"token": "a926ebdfc3684886a9b8fb52ac38b785"}');
      document.body.appendChild(cfBeacon);
    }
  </script>
</body>
</html>
